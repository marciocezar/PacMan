<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Pac-Man</title>
    <link rel="stylesheet" href="/src/systems/screen.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="board" width="152" height="214" aria-label="Pac-Man"></canvas>
    </div>
    <div id="dpad" hidden>
      <button type="button" data-dir="0" aria-label="Cima">▲</button>
      <button type="button" data-dir="3" aria-label="Esquerda">◀</button>
      <button type="button" data-dir="1" aria-label="Direita">▶</button>
      <button type="button" data-dir="2" aria-label="Baixo">▼</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
